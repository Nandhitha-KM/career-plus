# Server Configuration
server.port=8080

# SQLite Database Configuration
spring.datasource.url=jdbc:sqlite:career_plus.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Token Configuration
careerplus.app.jwtSecret=CareerPlusSuperSecretKeyForJwtTokenAuthenticationAuthorization2026SecureKey
careerplus.app.jwtExpirationMs=86400000

# Jackson JSON Formatter
spring.jackson.serialization.write-dates-as-timestamps=false
